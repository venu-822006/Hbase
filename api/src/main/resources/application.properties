server.port=8081
server.servlet.context-path=/
spring.application.name=crm-api

# HBase Configuration
hbase.zookeeper.quorum=localhost
hbase.zookeeper.property.clientPort=2181
hbase.client.retries.number=2
hbase.rpc.timeout=10000
hbase.client.operation.timeout=15000

# File Paths (fallback & ML outputs)
crm.data.dir=../data
crm.config.dir=../config
